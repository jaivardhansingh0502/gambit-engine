name: Build & Package Gambit Chess

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: GambitChess-Windows
            dist_glob: dist/GambitChess-Windows.zip
          - os: macos-latest
            artifact_name: GambitChess-macOS
            dist_glob: dist/GambitChess-macOS.*

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with Tkinter
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile C++ Engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          g++ -std=c++17 -O2 -static -static-libgcc -static-libstdc++ main.cpp Board.cpp Move.cpp Pawn.cpp Knight.cpp Bishop.cpp Rook.cpp Queen.cpp King.cpp Evaluation.cpp Search.cpp -o gambit.exe

      - name: Compile Universal C++ Engine (macOS)
        if: runner.os == 'macOS'
        run: |
          clang++ -std=c++17 -O2 -arch arm64 -arch x86_64 main.cpp Board.cpp Move.cpp Pawn.cpp Knight.cpp Bishop.cpp Rook.cpp Queen.cpp King.cpp Evaluation.cpp Search.cpp -o gambit || clang++ -std=c++17 -O2 main.cpp Board.cpp Move.cpp Pawn.cpp Knight.cpp Bishop.cpp Rook.cpp Queen.cpp King.cpp Evaluation.cpp Search.cpp -o gambit
          chmod +x gambit

      - name: Run Unit Test Suite (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v

      - name: Run Core Engine & Utils Test Suite (macOS)
        if: runner.os == 'macOS'
        run: python -m unittest tests/test_ai.py tests/test_chess_utils.py tests/test_engine.py tests/test_evaluation.py -v

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Package Standalone App
        run: python build_app.py --skip-compile

      - name: Upload Downloadable App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.dist_glob }}
          retention-days: 90

      - name: Attach to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.dist_glob }}
